server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API paths are reverse-proxied to the scoring service; everything else is
    # the single-page app, which falls back to index.html for client routing.
    location ~ ^/(rubrics|listings|photos|score|scores|auth) {
        proxy_pass http://scoring:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
